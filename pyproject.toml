[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls"
version = "0.2.0"
description = "Compile pinned Quilt Package scopes into least-authority AWS STS credentials"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX expression, supported by the pinned setuptools 83 and published
# as Metadata 2.4 License-Expression. Do not add a "License ::" classifier
# alongside it; the two forms are mutually exclusive.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "boto3==1.43.74",
  "packaging==26.3",
  "quilt3==8.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/quiltdata/pearls"
Repository = "https://github.com/quiltdata/pearls"
Changelog = "https://github.com/quiltdata/pearls/blob/main/CHANGELOG.md"
Issues = "https://github.com/quiltdata/pearls/issues"

[project.scripts]
pearls = "pearls.cli:run"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "cfn-lint==1.55.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pearls = ["py.typed", "templates/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=pearls --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "aws: live AWS authorization proof; skipped unless explicitly enabled",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  '\.\.\.',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pearls"]
ignore_missing_imports = true
