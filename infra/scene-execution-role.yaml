AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Administrator-applied broad Scene execution role. raja_sts narrows this
  role per Scene with an inline STS session policy.

Parameters:
  OrchestratorPrincipalArn:
    Type: String
    Description: IAM principal allowed to call sts:AssumeRole for Scene execution.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$'
  ProjectBucketArnPattern:
    Type: String
    Description: >-
      ARN for project buckets, optionally with a controlled wildcard, for example
      arn:aws:s3:::my-project-* or arn:aws:s3:::my-project-bucket.
    AllowedPattern: '^arn:aws:s3:::[a-z0-9.*-]+$'
  BedrockModelArn:
    Type: String
    Description: Exact Bedrock foundation model admitted by this execution role.
    AllowedPattern: '^arn:aws:bedrock:[a-z]{2}-[a-z]+-[0-9]+::foundation-model/[A-Za-z0-9][A-Za-z0-9._:-]*$'
  RoleName:
    Type: String
    Default: scene-execution
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
  MaxSessionDuration:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200

Resources:
  SceneExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: !Ref MaxSessionDuration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref OrchestratorPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BroadProjectBucketBoundary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource: !Ref ProjectBucketArnPattern
              - Sid: ProjectObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ProjectBucketArnPattern}/*"
              - Sid: ExactBedrockModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArn

Outputs:
  SceneExecutionRoleArn:
    Description: Pass this ARN to raja_sts.mint() or raja_sts.run_scene().
    Value: !GetAtt SceneExecutionRole.Arn
